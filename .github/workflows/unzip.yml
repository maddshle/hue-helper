
name: Extract ZIP to Main

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP to Main
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          output = Path("extracted")

          for archive in Path(".").rglob("*.zip"):
              if ".git" in archive.parts or "extracted" in archive.parts:
                  continue

              destination = output / archive.stem
              destination.mkdir(parents=True, exist_ok=True)

              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      if item.is_dir():
                          continue

                      target = (destination / item.filename).resolve()

                      if not target.is_relative_to(destination.resolve()):
                          raise ValueError("Unsafe ZIP path")

                      target.parent.mkdir(parents=True, exist_ok=True)

                      with z.open(item) as src:
                          with open(target, "wb") as dst:
                              dst.write(src.read())

          PY

      - name: Move Files to Main Directory
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          root = Path(".")
          extracted = root / "extracted"

          if extracted.exists():
              for source in extracted.iterdir():
                  target = root / source.name

                  if target.exists():
                      raise FileExistsError(
                          f"File/folder sudah ada: {target}"
                      )

                  shutil.move(str(source), str(target))

              shutil.rmtree(extracted)

          PY

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (
            git commit -m "Extract ZIP files to main directory"
            git push
          )
